<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Home | SentryGames</title>

    <!-- Favicon -->
    <link rel="icon" href="content/favicon.png" type="image/png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">

    <!-- SEO Meta Tags -->
    <meta name="description" content="SentryGames Unblocked - Play Games Unblocked">
    <meta name="keywords" content="unblocked games, free games, play games online, sentrygames, browser games">
    <meta name="author" content="SentryGames">

    <!-- Google Ads Placeholder -->
    <!-- Replace this comment with your Google Ads script -->

    <!-- Google Analytics Placeholder -->
    <!-- Replace this comment with your Google Analytics script -->

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #111111;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        h1 {
            font-size: 4em;
            font-weight: 800; /* ExtraBold */
            margin: 0;
        }

        .btn {
            font-size: 1.5em;
            font-weight: 800;
            color: black;
            background-color: white;
            border: none;
            padding: 15px 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.4s ease;
            margin-top: 30px;
        }

        .btn:hover {
            transform: scale(1.06);
        }

        .btn:hover .play-icon {
            transform: rotate(360deg);
        }

        .play-icon {
            display: inline-block;
            margin-right: 12px;
            transition: transform 0.4s ease;
        }

        .phone-number {
            font-size: 0.8em;
            color: #999;
            position: absolute;
            bottom: 20px;
        }

        footer {
            font-size: 0.8em;
            color: #999;
            position: absolute;
            bottom: 5px;
        }
    </style>
</head>
<body onload="fadeInContent()">

    <div class="container">
        <h1>SentryGames</h1>
        <a href="/all-games">
            <button class="btn">
                <span class="play-icon">▶</span> All Games
            </button>
        </a>
    </div>

    <!-- Phone number at the bottom -->
    <div class="phone-number">
        +1 (248) 434-5508
    </div>

    <!-- Footer with copyright -->
    <footer>
        &copy; SentryGames - <span id="current-year"></span>
    </footer>

    <script>
        // Set the current year
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Fade-in effect
        function fadeInContent() {
            document.body.style.opacity = '1';
        }

        // Trigger fade-in with a short delay
        window.onload = () => setTimeout(fadeInContent, 50);
    </script>
</body>
</html>
