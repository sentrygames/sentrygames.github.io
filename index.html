<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>selection system v2</title>
<style>
    body {
        font-family: 'Montserrat', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
    }

    .button-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        align-items: center;
        justify-content: center;
    }

    .button {
        display: inline-block;
        padding: 20px 40px;
        font-size: 18px;
        font-weight: 600;
        text-decoration: none;
        color: white;
        border: none;
        border-radius: 12px;
        margin: 10px;
        cursor: pointer;
        transition: transform 0.2s, background-position 0.5s;
        background-size: 200%;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        width: calc(100% - 40px);
        max-width: 197px;
    }

    .button::before {
        content: '';
        position: absolute;
        top: -40%;
        left: -110%;
        width: 200%;
        height: 200%;
        background: rgba(255, 255, 255, 0.2);
        transform: rotate(45deg);
        transition: all 0.5s;
    }

    .button:hover::before {
        top: -80%;
        left: -160%;
    }

    .button-black {
        background: linear-gradient(140deg, gray, black);
        background-position: 100% 100%;
    }

    .button-blue {
        background: linear-gradient(135deg, #004080, #1a1a1a);
        background-position: 100% 100%;
    }

    .button:hover {
        transform: scale(1.05);
        background-position: 0 0;
    }

    .button:active {
        transform: scale(0.98);
    }
</style>

<div class="button-container">
    <button class="button button-blue" onclick="handleClickWithEmbed()">Eggy Car</button>
</div>

<script>
    function handleClick(url) {
        setTimeout(function() {
            window.location.href = 'about:blank';
        }, 2000);

        window.open(url, '_blank');
    }

    function handleClickWithEmbed() {
        const embedTab = window.open('about:blank', '_blank');
        if (embedTab) {
            const embedHTML = `
            <style>html, body { margin: 0; height: 100%; }</style>
            <iframe src="https://eggycar.xyz/" style="border:none;width:100%;height:100%;"></iframe>`;
            embedTab.document.write(embedHTML);
            embedTab.document.close();
        } else {
            alert("Failed to open new tab. Please allow pop-ups.");
        }

        setTimeout(function() {
            window.location.href = 'about:blank';
        }, 2000);
    }
</script>
